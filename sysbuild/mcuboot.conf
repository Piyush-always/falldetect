# MCUboot only verifies and boots slot0/slot1 here - it never needs a console.
#
# The board's stock defconfig forces CONFIG_CONSOLE=y, and this board's
# console is USB CDC ACM, so that drags in the full USB device stack. That
# fails to link: MCUboot builds with CONFIG_MULTITHREADING=n (no kernel
# semaphores), but nrf_usbd_common.c calls k_sem_take/give unconditionally.
#
# OTA itself goes over the app's BLE mcumgr transport, never through
# MCUboot's own console/USB, so turning both off here is safe. Same fix as
# apps/blink/sysbuild/mcuboot.conf.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_DEVICE_STACK=n
