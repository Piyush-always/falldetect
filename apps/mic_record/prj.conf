# PDM microphone recorder.
#
# The USB CDC port carries framed binary audio, so NOTHING else may write to it.
# The console, the boot banner and the logging subsystem are all disabled: a
# single stray printk mid-stream injects ASCII into the PCM and shows up as a
# burst of noise in the recording. Status travels as TEXT frames instead.
#
# DT_CHOSEN(zephyr_console) still resolves with the console subsystem off - it
# is a devicetree property, independent of CONFIG_CONSOLE - so we keep using it
# to find the CDC ACM UART device.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_LOG=n

# Audio capture
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# USB CDC ACM data path
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="falldetect-gkl mic recorder"

CONFIG_RING_BUFFER=y

# The DMIC driver call path sits on the main thread; the default 1 KB is tight.
CONFIG_MAIN_STACK_SIZE=2048
