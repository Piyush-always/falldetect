# Phase 0 bring-up: LED blink.
#
# Deliberately minimal — no console, no USB, no sensor drivers. If this does not
# blink, the fault is in the toolchain, the flash path or the board, not in our
# code. Console and IMU come next, one at a time.

CONFIG_GPIO=y

# Repair the hardware reset line.
#
# This board arrived with UICR->PSELRESET unconfigured, which makes the RST
# button inert: 90 s of double-tapping produced no USB re-enumeration at all.
# Without a working RST there is no way back into the UF2 bootloader, because
# Zephyr's CDC does not implement the 1200-baud touch that the previous
# (Arduino/CircuitPython) firmware did.
#
# With this set, modules/hal/nordic/nrfx/mdk/system_nrf52.c (~line 344) checks
# PSELRESET[0]/[1] at boot, and if they are not Connected writes RESET_PIN to
# both and issues NVIC_SystemReset(). The write is guarded, so it happens once
# and is a no-op on every later boot.
#
# Kconfig is marked DEPRECATED in favour of `&uicr { gpio-as-nreset; }`, which
# this board's DTS already has — but that did not translate into the generated
# .config on NCS v3.1.1, and the built hex contained no UICR segment. The
# deprecated symbol is the mechanism that demonstrably works here, so it is
# used deliberately. Expect a deprecation warning at build time.
CONFIG_GPIO_AS_PINRESET=y

# BLE OTA. NCS's own fragment (the same one Nordic's Thingy:53 DFU sample
# uses) - selects MCUmgr, the image manager and flash map for us rather than
# hand-assembling those. See apps/blink/sysbuild.conf for the MCUboot side and
# apps/blink/boards/xiao_ble_nrf52840_sense.overlay for the partition layout
# both of this depend on.
#
# The fragment only *depends on* BT_PERIPHERAL, it does not select it - a
# first attempt without these two lines built clean but silently produced a
# non-BLE blink (Kconfig warned "assigned 'y' but got 'n'": unsatisfied
# BT_PERIPHERAL dependency), so they are required, not redundant.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_BT_DEVICE_NAME="falldetect-blink"

