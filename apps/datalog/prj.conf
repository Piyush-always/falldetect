# Labelled data-collection rig.
#
# Streams every accelerometer and gyroscope sample over USB CDC so the host can
# record labelled activity sessions. This is the corpus everything downstream
# depends on: the activity classifier, the fall thresholds, and the validation.

CONFIG_GPIO=y

# Keeps the RST button (and therefore the UF2 bootloader) reachable.
CONFIG_GPIO_AS_PINRESET=y

CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

# Data-ready trigger, on the driver's own thread. Sampling must be
# sensor-synchronous: polling on a k_sleep would jitter, and jittered timestamps
# quietly corrupt every frequency-domain feature the model will use.
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y
CONFIG_LSM6DSL_THREAD_STACK_SIZE=2048
CONFIG_LSM6DSL_THREAD_PRIORITY=5

# Full scale. Never collect at less than this - a clipped sample is
# indistinguishable from a real one and silently ruins the corpus.
# See ACCEL_PLAN.md section 4.1.
CONFIG_LSM6DSL_ACCEL_FS=16
CONFIG_LSM6DSL_GYRO_FS=2000

# Raw register access for the hardware pedometer (CTRL10_C, STEP_COUNTER_L/H).
# The Zephyr driver never writes CTRL10_C, so those registers are ours alone.
CONFIG_I2C=y

# The CDC port carries the sample stream and nothing else. Console, logging and
# the boot banner are all off so no stray text can land mid-record.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_LOG=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="falldetect-gkl datalog"

CONFIG_RING_BUFFER=y
CONFIG_MAIN_STACK_SIZE=2048

# BLE OTA - proved out first in apps/blink, same fragment and same reasoning.
# The fragment only *depends on* BT_PERIPHERAL, it does not select it, so
# CONFIG_BT/CONFIG_BT_PERIPHERAL are required here too, not redundant.
# Uses a distinct advertised name so blink/datalog/falldetect are
# distinguishable in a BLE scan when more than one is on a bench at once.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_BT_DEVICE_NAME="falldetect-datalog"

# Wireless telemetry: the same $D/$P/$I stream USB CDC already carries, also
# notified over Nordic UART Service - tools/fd_studio's BLE link connects to
# this. One BLE connection carries both this and the MCUmgr OTA service
# above; they are independent GATT services on the same peripheral.
CONFIG_BT_NUS=y

# Throughput. Without these the link negotiates the 23-byte ATT default, whose
# 20-byte payload is SMALLER THAN ONE $D LINE - so every sample notification
# fails and only the 13-byte $P pedometer line gets through. Measured: 1
# notification/sec instead of 208.
#
# MTU exchange is a GATT *client* procedure and Windows never initiates it, so
# the peripheral has to. That needs the client role compiled in even though we
# are a peripheral and use it for nothing else.
CONFIG_BT_GATT_CLIENT=y

# Device Information Service (0x180A). Standard GATT service, so nRF Connect,
# a phone, or any generic BLE tool can identify the device without knowing
# anything about this project.
#
# FW revision is deliberately NOT hardcoded: BT_DIS_FW_REV_STR defaults to
# $(APP_VERSION_TWEAK_STRING) (zephyr/subsys/bluetooth/services/Kconfig.dis:160),
# the same VERSION file that feeds the signed image. One source of truth - the
# advertised revision cannot drift from what MCUboot reports.
#
# Using MODEL_NUMBER/MANUF_NAME, not MODEL/MANUF: the latter are deprecated.
# Note BT_DIS_STR_MAX is 21, so these strings must stay short.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="falldetect-gkl"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="XIAO nRF52840 Sense"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="XIAO Sense"

# Battery Service (0x180F). Level is the standard characteristic; charge state
# rides on Battery Level Status (BAS 1.1), which this SDK supports via the
# bt_bas_bls_* API - so no custom service is needed for "is it charging".
CONFIG_BT_BAS=y
CONFIG_BT_BAS_BLS=y
CONFIG_BT_BAS_BLS_IDENTIFIER_PRESENT=y

# ADC for the battery divider. See boards/*.overlay - the divider values there
# are ASSUMED and must be confirmed against a multimeter.
CONFIG_ADC=y

# More ATT/L2CAP buffers so a 208 Hz stream is not throttled by a 3-buffer
# pool. Each in-flight notification holds one until it is acknowledged.
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Zephyr asserts EVT_RX_COUNT > ACL_TX_COUNT (bluetooth/buf.h:178): every ACL
# TX needs a completion event to come back, so the event pool must be able to
# outnumber the in-flight transmits or the controller can deadlock.
CONFIG_BT_BUF_EVT_RX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
