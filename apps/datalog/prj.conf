# Labelled data-collection rig.
#
# Streams every accelerometer and gyroscope sample over USB CDC so the host can
# record labelled activity sessions. This is the corpus everything downstream
# depends on: the activity classifier, the fall thresholds, and the validation.

CONFIG_GPIO=y

# Keeps the RST button (and therefore the UF2 bootloader) reachable.
CONFIG_GPIO_AS_PINRESET=y

CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

# Data-ready trigger, on the driver's own thread. Sampling must be
# sensor-synchronous: polling on a k_sleep would jitter, and jittered timestamps
# quietly corrupt every frequency-domain feature the model will use.
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y
CONFIG_LSM6DSL_THREAD_STACK_SIZE=2048
CONFIG_LSM6DSL_THREAD_PRIORITY=5

# Full scale. Never collect at less than this - a clipped sample is
# indistinguishable from a real one and silently ruins the corpus.
# See ACCEL_PLAN.md section 4.1.
CONFIG_LSM6DSL_ACCEL_FS=16
CONFIG_LSM6DSL_GYRO_FS=2000

# Raw register access for the hardware pedometer (CTRL10_C, STEP_COUNTER_L/H).
# The Zephyr driver never writes CTRL10_C, so those registers are ours alone.
CONFIG_I2C=y

# The CDC port carries the sample stream and nothing else. Console, logging and
# the boot banner are all off so no stray text can land mid-record.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_LOG=n

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="falldetect-gkl datalog"

CONFIG_RING_BUFFER=y
CONFIG_MAIN_STACK_SIZE=2048
