# falldetect-gkl - product firmware.
#
# Current scope is ACCEL_PLAN.md Stage A: bring the IMU up and prove the sensor,
# the I2C bus and the P1.08 power rail. Detection logic arrives once Phase 1 has
# produced data to tune against.

CONFIG_GPIO=y

# Repairs UICR->PSELRESET at boot if it is unconfigured, so the RST button (and
# therefore the UF2 bootloader) stays reachable. See apps/blink/prj.conf for the
# full reasoning - this board shipped with the reset line in an unknown state.
CONFIG_GPIO_AS_PINRESET=y

# IMU. The board devicetree binds the LSM6DS3TR-C to Zephyr's st,lsm6dsl driver;
# the two parts share a register map. TRIGGER_NONE is deliberate for Stage A -
# polling is enough to prove the sensor, and the data-ready trigger only matters
# once we are streaming (Stage B).
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_NONE=y

# Full-scale range. THIS IS NOT OPTIONAL - leaving these unset is a silent
# data-destroying bug.
#
# Both symbols default to 0 ("select at runtime"), and 0 resolves to
# LSM6DSL_DEFAULT_ACCEL_FULLSCALE 0 (+/-2 g) and LSM6DSL_DEFAULT_GYRO_FULLSCALE 4
# (+/-125 dps) in zephyr/drivers/sensor/st/lsm6dsl/lsm6dsl.h:562-564 and :586-588.
# A wrist impact saturates +/-2 g instantly, and a clipped sample is
# indistinguishable from a valid one - the peak we are trying to detect is
# flattened and nothing in the data reveals it. See ACCEL_PLAN.md section 4.1.
#
# Set at BUILD time rather than via SENSOR_ATTR_FULL_SCALE so it cannot be
# forgotten at runtime. Note this also undefines LSM6DSL_ACCEL_FS_RUNTIME, so
# SENSOR_ATTR_FULL_SCALE now returns -ENOTSUP - that is intended.
# ODR stays 0 (runtime) because we do want to sweep sample rates.
CONFIG_LSM6DSL_ACCEL_FS=16
CONFIG_LSM6DSL_GYRO_FS=2000

# Raw register access for the read-back assertion, and the seed of the
# hand-rolled register layer that will eventually own this chip.
CONFIG_I2C=y

# Console is already routed to USB CDC by the board (zephyr,console =
# &board_cdc_acm_uart), so printk reaches a COM port with no overlay.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="falldetect-gkl"
CONFIG_UART_LINE_CTRL=y

CONFIG_MAIN_STACK_SIZE=2048
